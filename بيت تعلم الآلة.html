L3: { ch: "ch1", n: 3, title: "المُصنِّف، والبارامتري، وهدف التعلم", en: "Classifier, Parametric & the Goal",

 cards: [

   i: "الخيّاط يأخذ مقاسات كثيرة (أنماط تدريب) ليقدّر شكل الثوب (النموذج). والثوب إما جاهز أو تفصيل.",

 ],

  {q: "The goal of ML algorithms is to reduce the classification error on training sample data which are finite.", qa: "هدف الخوارزميات تقليل خطأ التصنيف على بيانات تدريب محدودة.", o: TF, c: 0, w: "finite = محدودة. نص المنهج."},

  {q: "In cybersecurity, the main goal is only to reduce false positives.", qa: "في الأمن السيبراني الهدف فقط تقليل الإيجابيات الكاذبة.", o: TF, c: 1, w: "كلمة <b>only</b> هي الفخ؛ الهدف التوازن بين الاثنين."}
 ]},

L4: { ch: "ch1", n: 4, title: "التنقيب في البيانات وفئتاه", en: "Data Mining & its 2 Categories",

 ],

  {q: "A spam filter trained on emails labeled \"spam\" or \"ham\" is a:", qa: "فلتر البريد المدرب على رسائل مسمّاة هو:", o: ["supervised classifier", "unsupervised classifier", "reinforcement agent", "clustering method"], c: 0, w: "labeled = supervised."},

  {q: "Data mining is the extraction of knowledge from a large amount of data.", qa: "التنقيب هو استخراج المعرفة من كمية كبيرة من البيانات.", o: TF, c: 0, w: "التعريف حرفيًا."},

 ]},

L5: { ch: "ch1", n: 5, title: "سلّم اكتشاف المعرفة KDD", en: "KDD – 7 Steps",
 hook: "التنقيب الذي تعلمته ليس العملية كلها، بل <b>الدرجة الخامسة</b> في سلّم من سبع درجات اسمه KDD. احفظ الترتيب بجملة: <b>Can I See The Magic Pattern, Kid?</b>",

   i: "إزالة <b>الضوضاء</b> والبيانات غير المهمة. حاسمة أمنيًا لأن البيانات <b>غير متوازنة</b> (طبيعي أكثر بكثير من الهجمات) فيتحيّز النموذج.",

  {t: "2 Data Integration (I)", s: "In-te-gra-tion", a: "دمج البيانات", p: "🍹 الدرجة 2 – الخلاط",
   i: "مصادر <b>متعددة وغير متجانسة</b> في قاعدة بيانات <b>واحدة</b>.",

   ea: "يجمع البيانات من مصادر متعددة وغير متجانسة في قاعدة واحدة.", k: ["Heterogeneous", "غير متجانسة"]},

   e: "Data-selection techniques allow the user to obtain a reduced representation of the data set to keep the integrity of the original data set in a reduced volume.",
   ea: "تمثيل مصغر يحافظ على سلامة المجموعة الأصلية بحجم أصغر.", k: ["Reduced", "مصغّر"]},
  {t: "4 Data Transformation (T)", s: "Trans-for-ma-tion", a: "تحويل البيانات", p: "🍵 الدرجة 4 – السكر يذوب في الشاي",

L6: { ch: "ch1", n: 6, title: "خوارزميات التعلم في الأمن", en: "ML Algorithms in Cybersecurity",
 hook: "عرفت الطريقتين؛ الآن أسماء الخوارزميات تحت كل طريقة. القاعدة: إذا عرفت <b>الطريقة</b> عرفت مكان الخوارزمية في السؤال.",
 guess: {q: "k-means clustering is…", qa: "خوارزمية k-means هي…", o: ["Unsupervised", "Supervised"], c: 0},

  {t: "Random Forest", s: "Ran-dom For-est", a: "الغابة العشوائية", p: "🌳 الحديقة – صف أشجار يصد السيل",

 ],

  {q: "Log analysis and textual descriptions of vulnerabilities are handled by:", qa: "تحليل السجلات والأوصاف النصية للثغرات:", o: ["Transformer-based models (BERT)", "CNN", "Random Forest", "Autoencoders"], c: 0, w: "Logs = BERT."},

  {q: "An algorithm that quickly isolates atypical data points is:", qa: "خوارزمية تعزل النقاط غير النمطية بسرعة:", o: ["Isolation Forest", "Random Forest", "CNN", "SVM"], c: 0, w: "Isolates = Isolation Forest."},

 ]},

L7: { ch: "ch1", n: 7, title: "الأمن: التقليدي، التكيفي، وKerberos", en: "Conventional vs Adaptive & Kerberos",
 hook: "الآن نضع كل ما سبق في خدمة الحماية. السؤال المحوري: لماذا لا يكفي <b>القفل القديم</b>؟ لأنه يعرف المفاتيح المسجلة فقط.",
 guess: {q: "Signature-based security fails mostly against…", qa: "الأمن المبني على التوقيعات يفشل غالبًا أمام…", o: ["zero-day threats", "known viruses", "spam"], c: 0},
 cards: [
  {t: "Cybersecurity", s: "Cy-ber-se-cu-ri-ty", a: "الأمن السيبراني", p: "🧱 سور المنزل",
   i: "يحمي: <b>CS MEND</b> = Computers, Servers, Mobile devices, Electronic systems, Networks, Data. ويسمى أيضًا IT security.",
   e: "Cybersecurity is the practice of defending computers, servers, mobile devices, electronic systems, networks, and data from malicious attacks. It's also known as information technology security or electronic information security.",
   ea: "ممارسة الدفاع عن الحواسيب والخوادم والأجهزة والأنظمة والشبكات والبيانات من الهجمات، ويُعرف بأمن تقنية المعلومات.", k: ["Defending", "الدفاع"]},
  {t: "Conventional Cybersecurity System", s: "Net-work + Host", a: "النظام التقليدي (المخطط)", p: "🏘️ بوابة الحي ثم باب البيت",
   i: "التهديدات (virus, trojan, worm, botnet, spam) تمر أولًا بـ<b>دفاع الشبكة</b>: Firewall, Spam filter, Antivirus, Network IDS. ثم <b>دفاع المضيف</b>: Firewall, Antivirus, Host IDS.",
   e: "Network defense system: Firewall, Spam filter, Antivirus, Network intrusion detection. Host defense system: Firewall, Antivirus, Host intrusion detection.",
   ea: "دفاع الشبكة: جدار ناري، فلتر سبام، مضاد فيروسات، كشف تسلل شبكي. دفاع المضيف: جدار ناري، مضاد فيروسات، كشف تسلل المضيف.", k: ["Network + Host", "شبكة + مضيف"]},
  {t: "Conventional Security", s: "Con-ven-tion-al", a: "الأمن التقليدي", p: "🔑 قفل الباب القديم",
   i: "<b>ثابت</b> ومبني على <b>التوقيعات</b>. قوي ضد المعروف، و<b>ضعيف أمام zero-day</b> (لا توقيع لها بعد).",
   e: "Static and signature-based approach. Effective against known threats. Uses signature lists, predefined access rules, and firewalls to block known malicious traffic. Weakness: Ineffective against new (zero-day) threats that do not yet have a signature.",
   ea: "نهج ثابت مبني على التوقيعات، فعال ضد المعروف، ضعيف أمام تهديدات يوم الصفر.", k: ["Static", "ثابت"]},
  {t: "Adaptive Defense Systems", s: "A-dap-tive De-fense", a: "الأنظمة التكيفية", p: "🐕 كلب الحراسة",
   i: "<b>ديناميكي</b> ومبني على <b>السلوك</b>، يستخدم ML وAI، ويكشف المجهول بملاحظة الانحراف عن الطبيعي.",
   e: "Dynamic and behavior-based approach. Designed to learn and adapt to evolving threats. Uses machine learning and AI to analyze the behavior of systems, users, and networks. Strength: Capable of detecting anomalies and unknown threats by identifying deviations from normal behavior.",
   ea: "نهج ديناميكي مبني على السلوك، يتعلم ويتكيف، ويكشف الشذوذ والتهديدات المجهولة.", k: ["Dynamic", "ديناميكي"]},
  {t: "Conventional Defense + MFA", s: "M-F-A", a: "الأدوات التقليدية ما زالت مستخدمة", p: "🛡️ غرفة الحارس – عدة أقفال",
   i: "جدران الحماية وأدوات المصادقة وKerberos المدمج في Windows <b>ما زالت تُستخدم</b>، لكنها طبقة واحدة من طبقات، ويُعزَّز Kerberos بـ<b>MFA</b>.",
   e: "In modern environments, these conventional defense tools are still used, but they are only one of many layers of protection… The Kerberos system remains a fundamental component for authentication in an enterprise domain, but it is strengthened by techniques like Multi-Factor Authentication (MFA).",
   ea: "الأدوات التقليدية ما زالت مستخدمة كطبقة من طبقات، وKerberos يُعزَّز بالمصادقة متعددة العوامل.", k: ["Still used", "ما زالت"]},
  {t: "Kerberos (8 steps)", s: "Ker-ber-os", a: "مصادقة كيربروس", p: "🎫 مجلس الضيوف – تذكرة الدخول",
   i: "بدل إرسال كلمة السر كل مرة، نستخدم <b>تذكرة مؤقتة</b>. الخطوات: <b>DiDi – Anna – TiTi – AhAh</b><br>1 DNS Query (أين؟) · 2 DNS Response (العنوان) · 3 Anonymous Connect (أنا جون) · 4 Negotiate (Kerberos أو NTLM) · 5 TGS Request (يطلب تذكرة من AD) · 6 TGS Response (AD يصدر التذكرة) · 7 AP Request (يرسل التذكرة) · 8 AP Response (نجاح/فشل)",
   e: "A network authentication protocol that allows two entities to prove their identity to each other over an insecure network. In this process, a temporary \"Ticket\" is used to grant access to a resource without having to send the user's password repeatedly.",
   ea: "بروتوكول يتيح لكيانين إثبات هويتهما عبر شبكة غير آمنة، بتذكرة مؤقتة بدل إرسال كلمة السر مرارًا.", k: ["Ticket", "تذكرة"]},
  {t: "TGS Response ⭐", s: "T-G-S Re-sponse", a: "جواب سؤال الواجب", p: "🎫 الحارس يسلّم التذكرة",
   i: "<b>⭐ سؤال الواجب:</b> TGS Response هي الخطوة السادسة: وحدة التحكم الأمنية (Active Directory) تتحقق من هوية العميل وتصدر له تذكرة وصول آمنة.",
   e: "Step6: TGS Response with Ticket. The security controller issues the ticket. The controller verifies the client's identity and gives them a special, secure \"access ticket.\"",
   ea: "وحدة التحكم الأمنية تُصدر التذكرة بعد التحقق من هوية العميل وتعطيه تذكرة وصول آمنة.", k: ["Issues ticket", "يُصدر التذكرة"]}
 ],
 why: {q: "لماذا يفشل الأمن التقليدي أمام zero-day بينما ينجح التكيفي؟", a: "التقليدي يقارن بقائمة توقيعات، والهجوم الجديد ليس له توقيع بعد. التكيفي لا يسأل «هل أعرفه؟» بل «هل هذا السلوك طبيعي؟»، فيكشف الانحراف حتى لو كان المهاجم جديدًا."},
 teach: ["CS MEND + اسمه الآخر IT security", "النظام التقليدي: الشبكة ثم المضيف (Spam filter في الشبكة فقط)", "Conventional = Static/Signature، يفشل مع zero-day", "Adaptive = Dynamic/Behavior، يكشف المجهول", "Kerberos: تذكرة بدل كلمة السر، 8 خطوات، والسادسة TGS Response"],
 quiz: [
  {q: "Cybersecurity is also known as information technology security.", qa: "يُعرف الأمن السيبراني أيضًا بأمن تقنية المعلومات.", o: TF, c: 0, w: "or electronic information security."},
  {q: "A static and signature-based approach describes:", qa: "نهج ثابت مبني على التوقيعات:", o: ["Conventional security", "Adaptive defense systems", "Anomaly detection", "Reinforcement learning"], c: 0, w: "Static = Conventional."},
  {q: "Conventional security is effective against zero-day threats.", qa: "الأمن التقليدي فعال ضد تهديدات يوم الصفر.", o: TF, c: 1, w: "هذه نقطة ضعفه: ineffective against zero-day."},
  {q: "In the conventional cybersecurity system, the spam filter belongs to:", qa: "في النظام التقليدي، فلتر السبام يقع في:", o: ["Network defense system", "Host defense system", "Analysis engine"], c: 0, w: "Spam filter موجود في دفاع الشبكة فقط."},
  {q: "Kerberos sends the user's password repeatedly to access each resource.", qa: "Kerberos يرسل كلمة مرور المستخدم بشكل متكرر.", o: TF, c: 1, w: "يستخدم Ticket مؤقتة <b>without</b> sending the password repeatedly."},
  {q: "In Kerberos, the TGS Response is when:", qa: "في Kerberos، خطوة TGS Response هي عندما:", o: ["the security controller verifies the client's identity and issues a secure access ticket", "the client asks DNS for the server address", "the server says Welcome", "the client sends the ticket to the server"], c: 0, w: "⭐ جواب الواجب: الخطوة 6."},
  {q: "In step 4, the server accepts two methods:", qa: "في الخطوة 4 يقبل الخادم طريقتين:", o: ["Kerberos or NTLM", "MFA or 2FA", "DNS or HTTP", "SVM or CNN"], c: 0, w: "Negotiate (Kerberos, NTLM)."},
  {q: "Conventional defense tools are no longer used in modern environments.", qa: "أدوات الدفاع التقليدية لم تعد مستخدمة.", o: TF, c: 1, w: "still used, only one of many layers."}
 ]},

L8: { ch: "ch1", n: 8, title: "نظام الدفاع التكيفي (6 مكونات)", en: "Adaptive Defense System",
 hook: "هنا يعيش تعلم الآلة داخل الأمن: <b>محرك التحليل = نموذج ML</b>. تخيّل غرفة مراقبة من ست محطات، ورتّبها بجملة: <b>I Do Prefer Fresh Apple Drinks</b>.",
 guess: {q: "The \"brain\" of the adaptive defense system is the…", qa: "«دماغ» نظام الدفاع التكيفي هو…", o: ["analysis engine", "firewall", "data capturing tool"], c: 0},
 cards: [
  {t: "Not enough", s: "Meth-od-ol-o-gies", a: "لماذا نحتاج دفاعًا أعلى؟", p: "🧱 السور – لصوص يطوّرون حيلهم",
   i: "الدفاع ضد الهجمات <b>المكتشفة فقط لا يكفي</b>. والمهاجمون يستخدمون AI، فيجب التحول من <b>Reactive</b> (توقيعات) إلى <b>Proactive & Predictive</b>.",
   e: "Because of the constantly evolving cyber threats, building defense systems for discovered attacks is not enough to protect users… defense systems must shift from a reactive (signature-based) approach to a proactive and predictive one.",
   ea: "بناء دفاع للهجمات المكتشفة لا يكفي؛ يجب التحول من التفاعلي إلى الاستباقي والتنبؤي.", k: ["Not enough", "لا يكفي"]},
  {t: "Adaptive Defense System", s: "I-D-P-F-A-D", a: "النظام ومكوناته الستة", p: "🖥️ غرفة المراقبة – 6 محطات",
   i: "1 Information sources (الغرف) · 2 Data capturing tools (الكاميرات) · 3 Data preprocessing (تنظيف التسجيل) · 4 Feature extraction (قص اللقطة المهمة) · 5 Analysis engines (العقل) · 6 Decision of responses (قفل الأبواب). يتعلم <b>باستمرار</b>.",
   e: "This diagram represents an adaptive and intelligent defense architecture. Unlike static systems, this model continuously learns and adapts… The workflow goes from collecting raw data to automating responses.",
   ea: "بنية دفاع تكيفية ذكية تتعلم باستمرار، من جمع البيانات الخام إلى أتمتة الاستجابة.", k: ["Continuously learns", "يتعلم باستمرار"]},
  {t: "Data Capturing Tools", s: "Cap-tur-ing", a: "أدوات الالتقاط", p: "🎥 الكاميرات",
   i: "<b>Lin-Lib، Win-Win، Sun-Sol</b>: Libpcap لـLinux، Winpcap لـWindows، Solaris BSM لـSUN. والحديثة: EDR، سجلات السحابة، SQL، واجهات استخبارات التهديد.",
   e: "Data-capturing tools, such as Libpcap for Linux, Solaris BSM for SUN, and Winpcap for Windows, capture events from the audit trails of resource information sources.",
   ea: "أدوات مثل Libpcap وSolaris BSM وWinpcap تلتقط الأحداث من سجلات التدقيق.", k: ["Libpcap", "التقاط"]},
  {t: "Data Preprocessing", s: "Pre-pro-cess-ing", a: "المعالجة المسبقة", p: "🧹 تنظيف التسجيلات",
   i: "تستبعد الهجمات التي لها توقيعات جيدة، وتنظف: قيم شاذة، <b>قيم مفقودة</b>، تطبيع الخصائص.",
   e: "This module filters out the attacks for which good signatures have been learned… It involves data cleaning, handling outliers, managing missing values, and normalizing features.",

  {t: "Feature Extraction", s: "Fea-ture Ex-trac-tion", a: "استخراج الخصائص", p: "✂️ قص اللقطة المهمة",

 ],

L9: { ch: "ch1", n: 9, title: "الحلول: الاستباقي والتفاعلي ووحدات IDS", en: "Proactive, Reactive & IDS Modules",
 hook: "هنا يلتقي الفصل كله: <b>كشف التوقيع</b> يشبه Supervised (يعرف المسمّى، وأمثلته DT وRF وSVM)، و<b>كشف الشذوذ</b> يشبه Unsupervised (يتعلم الطبيعي، وأمثلته K-Means وAutoencoders وIsolation Forest). الوحدات الخمس بالترتيب: <b>My Aunt Hates Spicy Pizza</b>.",
 guess: {q: "Which detection can catch previously unknown attacks?", qa: "أي كشف يلتقط هجمات غير معروفة سابقًا؟", o: ["Anomaly detection", "Signature detection"], c: 0},
 cards: [
  {t: "Proactive", s: "Pro-ac-tive", a: "الاستباقي", p: "🧯 صيانة الكهرباء قبل الحريق",
   i: "<b>يتوقع ويزيل</b> الثغرات قبل الهجوم. يحتاج <b>API</b>: Authentication، تجنب Programming errors، Information protection. والحديث <b>TRV</b>: Threat intelligence، Risk analysis، Vulnerability management.",
   e: "Proactive approaches anticipate and eliminate vulnerabilities in the cyber system, while remaining prepared to defend effectively and rapidly against attacks.",
   ea: "الأساليب الاستباقية تتوقع الثغرات وتزيلها مع البقاء مستعدة للدفاع بسرعة.", k: ["Anticipate", "يتوقع"]},
  {t: "Reactive (IDS)", s: "Re-ac-tive", a: "التفاعلي", p: "🚨 جهاز إنذار الحريق",
   i: "<b>خط الدفاع الثاني</b> = أنظمة كشف التسلل IDS، تقرأ log files وnetwork flow لتحديد الضرر وتتبع المخترق ومنع التكرار.",
   e: "The second line of cyber defense is composed of reactive security solutions, such as intrusion detection systems (IDSs). IDSs detect intrusions based on the information from log files and network flow.",
   ea: "خط الدفاع الثاني حلول تفاعلية مثل IDS، تكشف التسلل من ملفات السجل وتدفق الشبكة.", k: ["Second line", "الخط الثاني"]},
  {t: "Misuse / Signature", s: "Sig-na-ture", a: "كشف التوقيع", p: "📸 لوحة صور المطلوبين",
   i: "يقارن الحدث بتوقيعات <b>معروفة</b>: فوري وإيجابيات كاذبة <b>أقل</b>، لكنه <b>لا يكشف الجديد</b>.<br>أمثلة: Decision Trees, Random Forest, SVMs, Deep Neural Networks.",
   e: "Misuse detection, also called signature detection, is an IDS triggering method that generates alarms when a known cyber misuse occurs… known attacks can be detected immediately and realizably with a lower false-positive rate. However, signature detection cannot detect novel attacks.",
   ea: "ينبّه عند إساءة معروفة؛ يكشف المعروف فورًا بإيجابيات كاذبة أقل، لكنه لا يكشف الهجمات الجديدة.", k: ["Known", "معروف"]},
  {t: "Anomaly", s: "A-nom-a-ly", a: "كشف الشذوذ", p: "👵 الجدة التي تحفظ روتين البيت",
   i: "خطوتان: <b>Training</b> (ملف للطبيعي بلا هجوم) ثم <b>Detection</b> (انحراف كبير = هجوم). يكشف <b>المجهول</b>، لكن <b>إنذاراته الكاذبة كثيرة</b>، والخصائص السيئة تضره، ويمكن تسميم تدريبه.<br>أمثلة: K-Means, Autoencoders, Isolation Forest.",
   e: "Anomaly detection triggers alarms when the detected object behaves significantly differently from the predefined normal patterns… Anomaly detection can detect previously unknown attacks. However, anomaly detection is hampered by a high rate of false alarms.",
   ea: "ينبّه عندما يختلف السلوك كثيرًا عن الطبيعي؛ يكشف المجهول لكن إنذاراته الكاذبة مرتفعة.", k: ["Deviate", "ينحرف"]},
  {t: "Hybrid", s: "Hy-brid", a: "الهجين", p: "👮 الحارس + الجدة معًا",
   i: "<b>يجمع</b> الاثنين ليعالج عيب كل منهما: التوقيع لا يعرف الجديد، والشذوذ كثير الإنذارات.<br>أمثلة: RF + XGBoost، K-Means + SVM، CNN + Bi-LSTM.",
   e: "Researchers have proposed hybrid detection techniques to combine anomaly and misuse detection techniques in IDSs.",
   ea: "اقترح الباحثون تقنيات هجينة تجمع كشف الشذوذ وكشف إساءة الاستخدام.", k: ["Combine", "يجمع"]},
  {t: "Scan", s: "Scan", a: "كشف المسح", p: "🪟 لص يتفقد النوافذ",
   i: "ينبّه عندما يمسح المهاجم الخدمات <b>قبل</b> الهجوم = <b>تمهيد</b> (precursor).",
   e: "Scan detection generates alerts when attackers scan services or computer components in network systems before launching attacks. A scan detector identifies the precursor of an attack.",
   ea: "ينبّه عندما يمسح المهاجمون الخدمات قبل شن الهجوم؛ يحدد تمهيد الهجوم.", k: ["Precursor", "تمهيد"]},
  {t: "Profiling + UEBA", s: "Pro-fil-ing · U-E-B-A", a: "التنميط", p: "📒 دفتر عادات أهل البيت",
   i: "يجمّع الاتصالات المتشابهة ويبحث عن السلوك <b>السائد</b>، ثم يحدد الشواذ. تطوّر إلى <b>UEBA</b>: ملف لكل مستخدم وجهاز وتطبيق، بـ<b>Unsupervised learning</b> والإحصاء.",
   e: "Profiling modules perform clustering algorithms or other data-mining and machine learning methods to group similar network connections and search for dominant behaviors… UEBA systems use unsupervised learning and statistics to create a profile of normal behavior for each user, device, or application.",
   ea: "تجمّع الاتصالات المتشابهة وتبحث عن السلوك السائد؛ وUEBA تنشئ ملفًا طبيعيًا لكل مستخدم وجهاز وتطبيق.", k: ["Dominant", "سائد"]}
 ],
 why: {q: "لماذا التوقيع إيجابياته الكاذبة قليلة، والشذوذ إنذاراته الكاذبة كثيرة؟", a: "التوقيع لا ينبّه إلا عند تطابق مع هجوم <b>معروف</b>، فنادرًا ما يخطئ. الشذوذ ينبّه لأي شيء <b>غير معتاد</b>، وليس كل غير معتاد هجومًا (موظف سهر يعمل)، فتكثر الإنذارات الكاذبة. ولهذا جاء <b>الهجين</b>."},
 teach: ["Proactive: يتوقع، API وTRV؛ Reactive: الخط الثاني IDS", "My Aunt Hates Spicy Pizza", "Signature: معروف، FP أقل، لا يكشف الجديد", "Anomaly: يكشف المجهول، إنذارات كثيرة", "Hybrid يجمع، Scan قبل الهجوم، Profiling سائد وUEBA"],
 quiz: [
  {q: "IDSs are proactive security solutions.", qa: "أنظمة IDS حلول استباقية.", o: TF, c: 1, w: "IDS = reactive (the second line of defense)."},
  {q: "Approaches that anticipate and eliminate vulnerabilities are:", qa: "الأساليب التي تتوقع الثغرات وتزيلها:", o: ["Proactive", "Reactive", "Signature detection", "Scan detection"], c: 0, w: "Anticipate = Proactive."},
  {q: "Signature detection can detect novel attacks.", qa: "كشف التوقيع يستطيع كشف الهجمات الجديدة.", o: TF, c: 1, w: "cannot detect novel attacks."},
  {q: "Signature detection detects known attacks with a lower false-positive rate.", qa: "كشف التوقيع يكشف المعروف بإيجابيات كاذبة أقل.", o: TF, c: 0, w: "نقطة قوته."},
  {q: "Anomaly detection has a low rate of false alarms.", qa: "كشف الشذوذ إنذاراته الكاذبة قليلة.", o: TF, c: 1, w: "high rate of false alarms."},
  {q: "Combining anomaly and misuse detection is called:", qa: "الجمع بين كشف الشذوذ والتوقيع:", o: ["Hybrid detection", "Profiling", "Scan detection", "UEBA"], c: 0, w: "Combine = Hybrid."},
  {q: "Alerts generated when attackers scan services before launching attacks come from:", qa: "تنبيهات عند مسح الخدمات قبل الهجوم:", o: ["Scan detection", "Anomaly detection", "Profiling modules"], c: 0, w: "Precursor = Scan."},
  {q: "UEBA systems use ______ to create a profile of normal behavior for each user.", qa: "تستخدم UEBA ____ لإنشاء ملف طبيعي لكل مستخدم.", o: ["unsupervised learning and statistics", "supervised learning only", "signature lists", "reinforcement rewards"], c: 0, w: "unsupervised learning and statistics."},
  {q: "Which is crucial for zero-day attacks?", qa: "أيها حاسم لهجمات يوم الصفر؟", o: ["Anomaly detection", "Signature detection", "Data selection"], c: 0, w: "ملخص الفصل: Anomaly crucial for zero-day."}
 ]},

L10: { ch: "ch2", n: 10, title: "أين يقع ML؟ وما تعريفاته؟", en: "AI ⊃ ML ⊃ DL & Definitions",
 hook: "الفصل الثاني يكبّر العدسة على «الآلة التي تتعلم». ابدأ بالخريطة: <b>دمية روسية</b> كبيرة AI، داخلها ML، وداخلها DL.",
 guess: {q: "In machine learning, the computer receives data and output, and produces…", qa: "في تعلم الآلة يتلقى الحاسوب البيانات والمخرجات وينتج…", o: ["a program", "an output", "a password"], c: 0},
 cards: [
  {t: "AI ⊃ ML ⊃ DL", s: "AI · ML · DL", a: "الدمية الروسية", p: "🪆 رف الصالة",
   i: "AI أكبر دائرة (1950s)، داخلها ML (1980s)، وداخلها DL (2010s).<br>ML يعطي AI <b>القدرة على التعلم</b>. DL فرع من ML <b>يحاكي دماغ الإنسان</b>.",
   e: "It is machine learning that gives AI the ability to learn… Deep learning, which is a subcategory of machine learning, provides AI with the ability to mimic a human brain's neural network.",
   ea: "تعلم الآلة يمنح AI القدرة على التعلم، والتعلم العميق فرع منه يحاكي الشبكة العصبية لدماغ الإنسان.", k: ["Subcategory", "فرع"]},
  {t: "Traditional Programming vs ML", s: "Pro-gram-ming", a: "البرمجة مقابل تعلم الآلة", p: "🍰 الوصفة والكعكة",
   i: "التقليدي: Data + <b>Program</b> = Output (الوصفة تعطي الكعكة).<br>ML: Data + <b>Output</b> = Program (الكعكة تعطي الوصفة).",
   e: "Traditional Programming: Data, Program → Computer → Output. Machine Learning: Data, Output → Computer → Program.",
   ea: "التقليدي: بيانات وبرنامج تعطي مخرجات. تعلم الآلة: بيانات ومخرجات تعطي برنامجًا.", k: ["Program", "البرنامج"]},
  {t: "&lt;P, T, E&gt;", s: "P-T-E", a: "مهمة تعلم محددة", p: "📖 غرفة المذاكرة – «بيتي»",
   i: "يتحسن <b>أداؤه P</b> في <b>مهمة T</b> بـ<b>الخبرة E</b>.<br>مثال البريد: T = تصنيف الرسائل spam/legitimate، P = نسبة الصحيح، E = قاعدة رسائل بعضها مسمّى.",
   e: "Study of algorithms that improve their performance P at some task T with experience E. well-defined learning task: &lt;P,T,E&gt;",
   ea: "دراسة خوارزميات تحسّن أداءها P في مهمة T مع الخبرة E.", k: ["P-T-E", "أداء · مهمة · خبرة"]},
  {t: "Arthur Samuel & Herbert Simon", s: "Sam-u-el · Si-mon", a: "تعريفان مشهوران", p: "🖼️ برواز على جدار غرفة المذاكرة",
   i: "<b>Samuel (1959)</b>: «بدون برمجة <b>صريحة</b>».<br><b>Simon</b>: «Simon says: <b>experience</b>»، أي عملية يتحسن فيها الأداء من الخبرة.",
   e: "\"A field of study that gives computers the ability to learn without being explicitly programmed\" (Arthur Samuel, 1959). \"Learning is any process by which a system improves performance from experience\" (Herbert Simon).",
   ea: "صموئيل: قدرة الحواسيب على التعلم دون برمجة صريحة. سايمون: التعلم أي عملية يحسّن بها النظام أداءه من الخبرة.", k: ["Explicitly", "صراحةً"]}
 ],
 why: {q: "لماذا نحتاج ML بدل أن نكتب برنامجًا عاديًا لكشف الهجمات؟", a: "لأننا لا نعرف قواعد كل هجوم لنكتبها. نعطي الحاسوب <b>أمثلة وأجوبتها</b> فيستنتج هو «البرنامج» (القواعد)، ويتحسن كلما زادت الخبرة E."},
 teach: ["AI أكبر، ثم ML، ثم DL", "التقليدي يُخرج Output، وML يُخرج Program", "P-T-E ومثال البريد", "Samuel = explicitly، Simon = experience"],
 quiz: [
  {q: "Deep learning is a subcategory of machine learning.", qa: "التعلم العميق فرع من تعلم الآلة.", o: TF, c: 0, w: "AI ⊃ ML ⊃ DL."},
  {q: "In machine learning, the computer is given:", qa: "في تعلم الآلة يُعطى الحاسوب:", o: ["Data and Output, and produces a Program", "Data and Program, and produces Output", "Only a Program", "Only Output"], c: 0, w: "ML = الكعكة تعطي الوصفة."},
  {q: "\"Without being explicitly programmed\" is the definition of:", qa: "«دون أن تُبرمج صراحةً» تعريف:", o: ["Arthur Samuel", "Herbert Simon", "Pedro Domingos", "Tom Mitchell"], c: 0, w: "Samuel 1959."},
  {q: "\"Learning is any process by which a system improves performance from experience\" is by:", qa: "«التعلم أي عملية يتحسن بها الأداء من الخبرة» قالها:", o: ["Herbert Simon", "Arthur Samuel", "Pedro Domingos"], c: 0, w: "Simon says: experience."},
  {q: "In the spam example of &lt;P,T,E&gt;, E is:", qa: "في مثال البريد، E هي:", o: ["a database of emails, some with human-given labels", "the percentage of emails correctly classified", "categorizing emails as spam or legitimate"], c: 0, w: "E = Experience = قاعدة الرسائل."},
  {q: "In &lt;P,T,E&gt;, P is the percentage of email messages correctly classified.", qa: "في P-T-E، P هي نسبة الرسائل المصنفة بشكل صحيح.", o: TF, c: 0, w: "P = Performance."}
 ]},

L11: { ch: "ch2", n: 11, title: "الأنواع بتفصيل وفئاتها", en: "Learning Types in Depth",
 hook: "نفس الأنواع الثلاثة من الفصل الأول، لكن الآن ندخل داخل كل نوع. Supervised نوعان: <b>«A أم B؟» = تصنيف</b>، و<b>«كم؟» = انحدار</b>.",
 guess: {q: "Predicting tomorrow's temperature is…", qa: "التنبؤ بدرجة حرارة الغد هو…", o: ["Regression", "Classification", "Clustering"], c: 0},
 cards: [
  {t: "Classification vs Regression", s: "Clas-si-fi-ca-tion · Re-gres-sion", a: "التصنيف والانحدار", p: "🍳 المطبخ – أطباق أم ميزان؟",
   i: "<b>Classification</b>: فئات منفصلة (Is it A or B? سبام أم لا؟ طائر أم لا؟).<br><b>Regression</b>: قيم متصلة (How much? How many? درجة الحرارة).",
   e: "Supervised machine learning: Learn to predict target values from labelled data. Classification (target values are discrete classes). Regression (target values are continuous values).",
   ea: "التنبؤ بقيم مستهدفة من بيانات مسمّاة؛ التصنيف قيم منفصلة، والانحدار قيم متصلة.", k: ["Discrete · Continuous", "منفصل · متصل"]},
  {t: "Supervised Pipeline", s: "Train · Pre-dict", a: "كيف يعمل خطوة بخطوة", p: "🍳 المطبخ – كتاب الوصفات",
   i: "1 بيانات تدريب بملصقات · 2 خوارزمية · 3 نموذج f · 4 مثال جديد · 5 <b>ملصق متوقع</b>. «Predicting the future based on the past».",
   e: "Training data (known labels) → learning algorithm → f; Test example → f → predicted label.",
   ea: "بيانات بملصقات معروفة تمر بالخوارزمية فينتج f، والمثال الجديد يدخل f فيخرج ملصق متوقع.", k: ["Expected label", "ملصق متوقع"]},
  {t: "Inductive Bias & Model", s: "In-duc-tive Bi-as", a: "التحيز الاستقرائي والنموذج", p: "🍳 لكل طاهٍ ذوقه",
   i: "كل خوارزمية تميل لفرضيات <b>أكثر احتمالًا</b> من غيرها = inductive bias. والنموذج تقريب جيد للبيانات، يُستخدم للتنبؤ، ولكل خوارزمية bias.",
   e: "Different learning algorithms/models have different hypotheses. Inductive bias: some hypotheses are more probable than others.",

 ],

  {q: "In the fraud detection example, the features are:", qa: "في مثال الاحتيال، الخصائص:", o: ["Time, Location, Amount", "Fraud rules, User history", "Credit card, Notification"], c: 0, w: "TLA."},

L13: { ch: "ch2", n: 13, title: "تعلم الآلة مقابل التعلم العميق", en: "ML vs Deep Learning",
 hook: "الفرق كله في سؤال: <b>من يصمم الخصائص؟</b> في ML الإنسان، وفي DL الطبقات تتعلمها بنفسها.",
 guess: {q: "Deep learning usually needs…", qa: "التعلم العميق يحتاج عادة…", o: ["large amounts of training data", "very little data", "no data"], c: 0},
 cards: [
  {t: "ML in Practice", s: "Fea-tures + Al-go-rithm", a: "تعلم الآلة عمليًا", p: "🧩 الأب يجهّز قطع اللغز",
   i: "عملان: <b>وصف البيانات بخصائص</b> يفهمها الحاسوب (خاص بالمجال) + <b>خوارزمية</b> تحسّن الأوزان.",
   e: "Conventional machine learning methods rely on human-designed feature representations. ML becomes just optimizing weights to best make a final prediction.",
   ea: "تعلم الآلة التقليدي يعتمد على خصائص يصممها الإنسان، ويصبح مجرد تحسين للأوزان.", k: ["Human-designed", "يصممه الإنسان"]},
  {t: "Deep Learning", s: "Deep Learn-ing", a: "التعلم العميق", p: "🧠 الطفل يتعلم وحده",
   i: "<b>طبقات متعددة</b> تتعلم تمثيل البيانات. ML: Input، Feature extraction، Classification، Output. DL: Input، (Feature extraction + Classification معًا)، Output.",
   e: "Deep learning (DL) is a machine learning subfield that uses multiple layers for learning data representations. DL is exceptionally effective at learning patterns.",
   ea: "فرع من تعلم الآلة يستخدم طبقات متعددة لتعلم تمثيلات البيانات.", k: ["Multiple layers", "طبقات متعددة"]},
  {t: "Hierarchical Features", s: "P-E-T-P-O", a: "الخصائص الهرمية", p: "🧩 بناء اللغز قطعة قطعة",
   i: "Pixels ثم <b>Edges</b> ثم Textures ثم Parts ثم Objects (منخفض، متوسط، عالي المستوى).",
   e: "DL applies a multi-layer process for learning rich hierarchical features. Input image pixels → Edges → Textures → Parts → Objects.",
   ea: "بكسلات، حواف، نقوش، أجزاء، أجسام.", k: ["Edges", "حواف"]},
  {t: "Why DL is Useful", s: "End-to-end", a: "لماذا هو مفيد", p: "🧩 الطفل الذكي",
   i: "إطار مرن للصور والنص واللغة، بإشراف أو بدونه، <b>end-to-end</b>، يحتاج <b>بيانات كثيرة</b>، تفوّق منذ <b>2010</b> (أولًا الرؤية والكلام ثم NLP).<br>مثال الرسائل: TF-IDF مع ML التقليدي، وWord Embedding مع DL.",
   e: "DL provides a flexible, learnable framework… Can learn in supervised and unsupervised manner. DL represents an effective end-to-end learning system. Requires large amounts of training data. Since about 2010, DL has outperformed other ML techniques.",
   ea: "إطار مرن، يتعلم بإشراف وبدونه، نظام من البداية للنهاية، يحتاج بيانات كثيرة، وتفوق منذ 2010.", k: ["End-to-end", "من البداية للنهاية"]}
 ],
 why: {q: "لماذا يحتاج DL بيانات أكثر من ML التقليدي؟", a: "لأنه يتعلم الخصائص بنفسه بدل أن يعطيها له الإنسان، وتعلّم الخصائص من الصفر يحتاج أمثلة كثيرة جدًا."},
 teach: ["ML: خصائص يصممها الإنسان", "DL: طبقات متعددة، استخراج + تصنيف معًا", "Pixels, Edges, Textures, Parts, Objects", "end-to-end، بيانات كثيرة، 2010", "TF-IDF مع ML، Word Embedding مع DL"],
 quiz: [
  {q: "Deep learning requires small amounts of training data.", qa: "التعلم العميق يحتاج كميات قليلة من البيانات.", o: TF, c: 1, w: "Requires <b>large</b> amounts."},
  {q: "Human-designed feature representations are used by:", qa: "الخصائص التي يصممها الإنسان يعتمد عليها:", o: ["Conventional machine learning", "Deep learning", "Autoencoders"], c: 0, w: "human-designed = ML."},
  {q: "In hierarchical features, what comes right after pixels?", qa: "في الخصائص الهرمية، ماذا يأتي بعد البكسلات؟", o: ["Edges", "Textures", "Parts", "Objects"], c: 0, w: "P-E-T-P-O."},
  {q: "Since about 2010, DL has outperformed other ML techniques, first in vision and speech.", qa: "منذ 2010 تفوّق DL، أولًا في الرؤية والكلام.", o: TF, c: 0, w: "ثم NLP."},
  {q: "In the spam sample, Word Embedding is used with:", qa: "في مثال الرسائل، Word Embedding يُستخدم مع:", o: ["Deep learning", "Traditional machine learning", "Reinforcement learning"], c: 0, w: "TF-IDF مع ML، وEmbedding مع DL."},
  {q: "In deep learning, feature extraction and classification are done together.", qa: "في DL يتم استخراج الخصائص والتصنيف معًا.", o: TF, c: 0, w: "Feature extraction + Classification."}
 ]},

L14: { ch: "ch2", n: 14, title: "الشبكات العصبية", en: "Neural Networks",
 hook: "داخل DL توجد الشبكة العصبية. تخيّل <b>لوحة مفاتيح إضاءة</b>: كل مفتاح له قوة (وزن)، وإضاءة أساسية (انحياز)، ولمبة تقرر تشتغل أو لا (دالة التفعيل).",
 guess: {q: "In MNIST, a 16×16 image gives how many inputs?", qa: "في MNIST، صورة 16×16 تعطي كم مدخلًا؟", o: ["256", "32", "16"], c: 0},
 cards: [
  {t: "MNIST", s: "M-N-I-S-T", a: "التعرف على الأرقام المكتوبة", p: "🧩 سبورة الأرقام",
   i: "شدة كل بكسل مدخل: 16×16 = <b>256</b> (حبر = 1، بلا حبر = 0). المخرج فئة الرقم، وكل بُعد ثقة رقم، والأعلى (0.7) هو «2».",
   e: "Handwritten digit recognition (MNIST dataset). The intensity of each pixel is considered an input element. Output is the class of the digit.",
   ea: "التعرف على الأرقام المكتوبة: شدة كل بكسل مدخل، والمخرج فئة الرقم.", k: ["256", "بكسل"]},
  {t: "Elements & Single Neuron", s: "W-B-A", a: "عناصر الشبكة والعصبون", p: "💡 لوحة الإضاءة",
   i: "<b>Weights, Biases, Activation functions</b>. العصبون: z = a1w1 + … + aKwK + b ثم a = σ(z). يحوّل مدخلات إلى رقم واحد (f: R^K → R).",
   e: "A NN with one hidden layer and one output layer: Weights, Biases, Activation functions. A single neuron maps a set of inputs into an output number.",
   ea: "عناصر الشبكة: الأوزان والانحيازات ودوال التفعيل؛ العصبون يحول المدخلات إلى رقم.", k: ["Weights · Bias", "أوزان · انحياز"]},
  {t: "Deep NNs (MLP)", s: "Dense", a: "الشبكات العميقة", p: "💡 طوابق من الأسلاك",
   i: "طبقات مخفية كثيرة، <b>كثيفة</b> (Fully-connected = Dense = MLP): كل عصبون متصل بكل عصبونات الطبقة التالية.",
   e: "Deep NNs have many hidden layers. Fully-connected (dense) layers (a.k.a. Multi-Layer Perceptron or MLP). Each neuron is connected to all neurons in the succeeding layer.",
   ea: "طبقات مخفية كثيرة متصلة بالكامل (MLP)، كل عصبون متصل بكل عصبونات الطبقة التالية.", k: ["Dense", "كثيفة"]},
  {t: "Deeper vs Shallow", s: "Plat-eau", a: "العميقة مقابل الضحلة", p: "💡 زيادة الطوابق",
   i: "الأعمق أفضل… <b>حتى حد</b>، ثم يثبت الأداء (plateau).",
   e: "Deeper networks perform better than shallow networks. But only up to some limit: after a certain number of layers, the performance of deeper networks plateaus.",
   ea: "الأعمق أفضل من الضحلة، لكن حتى حد، ثم يثبت الأداء.", k: ["Plateaus", "يثبت"]}
 ],
 why: {q: "لماذا لا نضيف طبقات بلا نهاية إذا كان الأعمق أفضل؟", a: "لأن المنهج يقول إن الأداء يتحسن <b>حتى حد</b> ثم يثبت (plateau). بعده الطبقات الإضافية لا تضيف شيئًا يُذكر."},
 teach: ["MNIST: 256 مدخل، 10 مخرجات ثقة", "W-B-A، وz ثم σ(z)", "Dense = Fully-connected = MLP", "أعمق أفضل حتى حد ثم plateau"],

  {q: "In the MNIST example, the input is:", qa: "في مثال MNIST، المدخل:", o: ["16 × 16 = 256", "28 × 28 = 784", "10 classes", "3 colors"], c: 0, w: "16×16=256 في الشريحة."},
  {q: "Deeper networks always perform better without any limit.", qa: "الشبكات الأعمق دائمًا أفضل بلا حد.", o: TF, c: 1, w: "plateaus after a certain number of layers."},
  {q: "Fully-connected layers are also called:", qa: "الطبقات المتصلة بالكامل تسمى أيضًا:", o: ["Dense layers / MLP", "Convolutional layers", "Recurrent layers"], c: 0, w: "Dense = MLP."},
  {q: "In a = σ(z), σ is the:", qa: "في a = σ(z)، σ هي:", o: ["activation function", "weight", "bias", "input"], c: 0, w: "Activation function."},
  {q: "A single neuron maps a set of inputs into an output number.", qa: "العصبون الواحد يحول مدخلات إلى رقم مخرج.", o: TF, c: 0, w: "f: R^K → R."}
 ]},

const ORDER = ["L1","L2","L3","L4","L5","L6","L7","L8","L9","L10","L11","L12","L13","L14","L15"];

<script>
(function(){
const PASS = 80;
const app = document.getElementById('app');
const today = () => new Date().toISOString().slice(0,10);
const addDays = (n) => { const d = new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const qid = (L,i) => L + '-' + i;
const allQ = (L) => LESSONS[L].quiz.map((q,i)=>({...q, id:qid(L,i), L}));
const findQ = (id) => { const [L,i] = id.split('-'); return {...LESSONS[L].quiz[+i], id, L}; };
const shuffle = (a) => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

// ---------- state & persistence ----------
let S = {v:1, done:{}, box:{}, tests:{}, open:{}};
const LK = 'mlhouse-progress-v1';
try { const s = JSON.parse(localStorage.getItem(LK) || 'null'); if (s && s.v === 1) S = Object.assign(S, s); } catch(e){}
let dbRef = null, saving = Promise.resolve(), saveTimer = null, saveNote = 'محفوظ على هذا الجهاز';
function save(){
  try { localStorage.setItem(LK, JSON.stringify(S)); } catch(e){}
  if (!dbRef) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const body = JSON.parse(JSON.stringify(S));
    saving = saving.then(() => dbRef.set(body)).catch(() => {});
  }, 700);
}
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const [user, db] = await Promise.all([claude.use('user'), claude.use('db')]);
    if (!user || !db) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc('data/users/' + id + '/progress');
    const snap = await ref.get();
    dbRef = ref;
    saveNote = 'يُحفظ تقدّمك في حسابك على كل أجهزتك';
    if (snap.exists) {
      const d = snap.data();
      if (d && d.v === 1) { S = Object.assign({v:1, done:{}, box:{}, tests:{}, open:{}}, JSON.parse(JSON.stringify(d))); try{localStorage.setItem(LK, JSON.stringify(S));}catch(e){} }
    } else if (Object.keys(S.done).length || Object.keys(S.box).length) { save(); }
    if (view.name === 'home') render();
  } catch(e) {}
})();

// ---------- derived ----------
const passed = (L) => (S.done[L] && S.done[L].s >= PASS);
function unlocked(L){
  const i = ORDER.indexOf(L);
  return i === 0 || passed(ORDER[i-1]) || !!S.open[L];
}
const dueIds = () => Object.entries(S.box).filter(([id,b]) => b.due <= today()).map(([id]) => id);
const chLessons = (ch) => ch.days.flatMap(d => d.lessons);

// ---------- views ----------
let view = {name:'home'};
function go(v){ view = v; render(); window.scrollTo({top:0}); }

function top(){
  const n = ORDER.filter(passed).length;
  return `<div class="top"><div class="toprow"><p class="brand">🏠 بيت تعلم الآلة</p>
  ${view.name!=='home' ? '<button class="btn ghost small" data-act="home">الرئيسية</button>' : `<span class="meta">${n} / ${ORDER.length} درس</span>`}</div>
  <div class="bar" aria-label="التقدم"><i style="width:${Math.round(n/ORDER.length*100)}%"></i></div></div>`;
}

function home(){
  const due = dueIds().length;
  let h = top();
  h += `<div class="stack">`;
  h += `<section class="panel"><h2>ذاكر بالطريقة التي تثبّت</h2>
  <p class="sub">كل درس صغير ويمر بخمس خطوات مبنية على أقوى طرق التثبيت: التخمين قبل التعلم، ثم الربط، ثم الشرح بصوتك، ثم الاسترجاع. وما تخطئ فيه يرجع لك في الأيام التالية.</p>
  <div class="method"><div><b>١ خمّن</b>قبل الدرس</div><div><b>٢ افهم</b>بطاقات قصيرة</div><div><b>٣ اربط</b>سؤال لماذا</div><div><b>٤ اشرح</b>بصوتك</div><div><b>٥ اختبر</b>٨٠٪ للعبور</div></div></section>`;
  h += `<div class="review"><div><b>مراجعة اليوم</b><div class="meta">${due ? due + ' سؤال أخطأت فيه سابقًا وحان وقته' : 'لا شيء مستحق الآن. ابدأ درسك الجديد.'}</div></div>
  ${due ? '<button class="btn small" data-act="review">ابدأ المراجعة (٥ دقائق)</button>' : ''}</div>`;
  for (const ch of CHAPTERS){
    const ls = chLessons(ch); const doneN = ls.filter(passed).length;
    h += `<section class="chap"><div class="chhead"><div><h2>${ch.title}</h2><div class="meta en" style="text-align:right">${ch.en}</div></div>
    <button class="btn ghost small" data-act="thread" data-ch="${ch.id}">الخيط الذي يربط الفصل</button></div>`;
    for (const d of ch.days){
      h += `<div class="day">اليوم ${d.d}</div>`;
      for (const L of d.lessons){
        const l = LESSONS[L], u = unlocked(L), dn = S.done[L];
        const chip = dn ? (dn.s >= PASS ? `<span class="chip done">✓ ${dn.s}%</span>` : `<span class="chip retry">${dn.s}% أعد</span>`) : (u ? '<span class="chip go">ابدأ</span>' : '<span class="chip lock">🔒 مقفل</span>');
        h += `<button class="row ${u?'':'locked'}" data-act="lesson" data-l="${L}"><span class="num">${l.n}</span><span class="tx"><b>${l.title}</b><span class="en">${l.en}</span></span>${chip}</button>`;
      }
    }
    const allDone = doneN === ls.length, best = S.tests[ch.id];
    h += `<button class="row ${allDone?'':'locked'}" data-act="test" data-ch="${ch.id}"><span class="num">★</span><span class="tx"><b>اختبار الفصل ${ch.n} الشامل</b><span>١٢ سؤالًا مخلوطًا من كل الدروس</span></span>${best!=null?`<span class="chip done">أفضل ${best}%</span>`:(allDone?'<span class="chip go">ابدأ</span>':`<span class="chip lock">${doneN}/${ls.length}</span>`)}</button></section>`;
  }
  h += `<section class="chap"><h2>قادم</h2>
  <div class="row soon locked"><span class="num">٣</span><span class="tx"><b>الفصل الثالث</b><span>يُضاف هنا عندما ينزّله الدكتور</span></span><span class="chip lock">قريبًا</span></div>
  <div class="row soon locked"><span class="num">⛓</span><span class="tx"><b>مادة البلوكتشين</b><span>قسم مستقل بنفس الطريقة</span></span><span class="chip lock">قريبًا</span></div></section>`;
  h += `<p class="save">${saveNote}</p></div>`;
  return h;
}

function thread(chId){
  const ch = CHAPTERS.find(c=>c.id===chId);
  return top() + `<section class="panel thread"><h2>الخيط الذي يربط ${ch.title}</h2><p class="sub">اقرأها كقصة واحدة. إذا فهمت لماذا تأتي كل حلقة بعد التي قبلها، صار الحفظ أسهل بكثير.</p>${ch.thread.map(p=>`<p>${p}</p>`).join('')}
  <div class="nav"><button class="btn" data-act="home">رجوع</button></div></section>`;
}

// ----- lesson flow -----
const STEPS = ['خمّن','افهم','اربط','اشرح','اختبر'];
function stepsBar(k){ return `<div class="steps">${STEPS.map((s,i)=>`<span class="${i===k?'on':(i<k?'past':'')}">${s}</span>`).join('')}</div>`; }

function lessonView(){
  const L = view.L, l = LESSONS[L], st = view.step;
  let h = top() + `<h2>${l.n}. ${l.title}</h2><div class="meta en" style="text-align:right;margin-bottom:8px">${l.en}</div>` + stepsBar(st);
  if (st === 0){
    const g = l.guess, a = view.gAns;
    h += `<section class="panel"><h3>خمّن قبل أن تتعلم</h3><p class="sub">لا يُحسب عليك. التخمين يجهّز عقلك فيلتقط الجواب حين يمر عليك.</p>
    <p class="q">${g.q}</p><p class="qa">${g.qa}</p><div class="opts">${g.o.map((o,i)=>`<button class="opt ${a!=null?(i===g.c?'right':(i===a?'wrong':'')):''}" data-act="guess" data-i="${i}" ${a!=null?'disabled':''}>${o}</button>`).join('')}</div>
    ${a!=null?`<div class="fb ${a===g.c?'ok':'no'}"><b class="t">${a===g.c?'تخمين صحيح!':'ليس تمامًا'}</b>ستعرف السبب في البطاقات.</div><div class="nav"><span></span><button class="btn" data-act="step" data-s="1">ابدأ الدرس</button></div>`:''}</section>`;
  } else if (st === 1){
    const i = view.card, c = l.cards[i];
    h += (i===0?`<div class="hook">${l.hook}</div>`:'');
    h += `<section class="panel card"><span class="place">${c.p}</span>
    <p class="term">${c.t}</p><div class="syl">${c.s}</div><div class="ar">${c.a}</div>
    <div class="idea">${c.i}</div>
    <div class="exam"><div class="lbl">نص المنهج كما يأتي في الاختبار</div><p class="e">${c.e}</p><div class="ea">${c.ea}</div></div>
    <div class="kw"><span class="k1">${c.k[0]}</span><span class="k2">${c.k[1]}</span><small>كلمة الاستدلال</small></div></section>
    <div class="dots">${l.cards.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}</div>
    <div class="nav">${i>0?'<button class="btn ghost" data-act="card" data-d="-1">السابق</button>':'<span></span>'}
    ${i<l.cards.length-1?'<button class="btn" data-act="card" data-d="1">التالي</button>':'<button class="btn" data-act="step" data-s="2">إلى الربط</button>'}</div>`;
  } else if (st === 2){
    h += `<section class="panel"><h3>اربط: سؤال «لماذا؟»</h3><p class="sub">فكّر في الجواب بنفسك ١٥ ثانية قبل أن تكشفه. هذه أقوى خطوة للفهم.</p>
    <p style="font-weight:700">${l.why.q}</p>
    ${view.rev?`<div class="reveal">${l.why.a}</div>`:'<button class="btn ghost" data-act="rev">اكشف الجواب</button>'}
    <div class="nav"><button class="btn ghost" data-act="step" data-s="1">رجوع للبطاقات</button><button class="btn" data-act="step" data-s="3" ${view.rev?'':'disabled'}>التالي</button></div></section>`;
  } else if (st === 3){
    const ck = view.ck || [];
    h += `<section class="panel"><h3>اشرحها بصوتك</h3><p class="sub">أغلق عينيك أو اقلب الجوال، واشرح الدرس بصوت مسموع في دقيقة كأنك تشرحه لطالب. ثم علّم على ما ذكرته.</p>
    ${l.teach.map((t,j)=>`<label class="check"><input type="checkbox" id="ck-${L}-${j}" data-act="ck" data-j="${j}" ${ck[j]?'checked':''}><span>${t}</span></label>`).join('')}
    <p class="meta">${ck.filter(Boolean).length < l.teach.length ? 'ما لم تذكره ارجع له في البطاقات، ثم تابع.' : 'ممتاز، ذكرت كل النقاط.'}</p>
    <div class="nav"><button class="btn ghost" data-act="step" data-s="1">رجوع للبطاقات</button><button class="btn" data-act="startquiz">ابدأ الاختبار</button></div></section>`;
  } else {
    h += quizBody();
  }
  return h;
}

// ----- quiz engine (lesson / review / test) -----
function prepQ(q){
  const idx = q.o === TF ? [0,1] : shuffle(q.o.map((_,i)=>i));
  return {...q, idx};
}
function startQuiz(kind, list, meta){
  view = Object.assign({}, view, {quiz:{kind, list:list.map(prepQ), i:0, ans:null, right:0, wrongIds:[], meta}});
  if (kind === 'lesson') view.step = 4;
  render(); window.scrollTo({top:0});
}
function quizBody(){
  const Q = view.quiz;
  if (Q.i >= Q.list.length) return resultBody();
  const q = Q.list[Q.i], a = Q.ans, tf = q.o === TF;
  let h = `<section class="panel"><div class="chhead"><span class="qcount">سؤال ${Q.i+1} من ${Q.list.length}</span>${Q.kind!=='lesson'?`<span class="meta">من درس ${LESSONS[q.L].n}</span>`:''}</div>
  <p class="q" style="margin-top:8px">${q.q}</p><p class="qa">${q.qa}</p><div class="opts">`;
  h += q.idx.map(i => {
    let cls = 'opt' + (tf?' tf':'');
    if (a != null){ if (i === q.c) cls += ' right'; else if (i === a) cls += ' wrong'; }
    return `<button class="${cls}" data-act="ans" data-i="${i}" ${a!=null?'disabled':''}>${q.o[i]}</button>`;
  }).join('') + `</div>`;
  if (a != null){
    const ok = a === q.c;
    h += `<div class="fb ${ok?'ok':'no'}"><b class="t">${ok?'صح ✓':'خطأ ✗ — الصحيح: '+(tf?q.o[q.c]:'<span class="en">'+q.o[q.c]+'</span>')}</b>${q.w}</div>
    <div class="nav"><span></span><button class="btn" data-act="nextq">${Q.i < Q.list.length-1 ? 'التالي' : 'النتيجة'}</button></div>`;
  }
  return h + `</section>`;
}
function resultBody(){
  const Q = view.quiz, pct = Math.round(Q.right / Q.list.length * 100);
  let h = `<section class="panel" style="text-align:center"><div class="big">${pct}%</div><p class="sub">${Q.right} صحيحة من ${Q.list.length}</p>`;
  if (Q.kind === 'lesson'){
    const L = view.L, idx = ORDER.indexOf(L), nxt = ORDER[idx+1];
    if (pct >= PASS){
      h += `<p><b>عبرت الدرس.</b> ${Q.wrongIds.length ? 'الأسئلة التي أخطأت فيها ستعود لك غدًا في المراجعة.' : 'بلا أخطاء، ممتاز.'}</p>`;
      h += `<p class="sub">قبل أن تنتقل: قل كلمات الاستدلال بصوتك مرة أخيرة دون النظر.</p>`;
      h += `<div class="nav" style="justify-content:center;flex-wrap:wrap">${nxt ? `<button class="btn" data-act="lesson" data-l="${nxt}">الدرس التالي</button>` : ''}<button class="btn ghost" data-act="home">الرئيسية</button></div>`;
    } else {
      h += `<p><b>تحتاج ${PASS}% للعبور.</b> هذا طبيعي في المحاولة الأولى. راجع البطاقات بسرعة ثم أعد الاختبار.</p>
      <div class="nav" style="justify-content:center;flex-wrap:wrap"><button class="btn" data-act="step" data-s="1">راجع البطاقات</button><button class="btn ghost" data-act="startquiz">أعد الاختبار</button></div>`;
    }
  } else if (Q.kind === 'review'){
    h += `<p>${Q.wrongIds.length ? 'ما أخطأت فيه سيعود غدًا. وما أصبت فيه يتباعد موعده.' : 'كل المراجعة صحيحة. انتقل لدرسك الجديد.'}</p><div class="nav" style="justify-content:center"><button class="btn" data-act="home">الرئيسية</button></div>`;
  } else {
    h += `<p>${pct >= PASS ? 'الفصل ثابت عندك. راجع الخيط الذي يربطه مرة قبل النوم.' : 'راجع الدروس التي ظهرت في أخطائك، ثم أعد الاختبار غدًا.'}</p><div class="nav" style="justify-content:center;flex-wrap:wrap"><button class="btn ghost" data-act="thread" data-ch="${Q.meta}">الخيط الذي يربط الفصل</button><button class="btn" data-act="home">الرئيسية</button></div>`;
  }
  return h + `</section>`;
}
function finishQuiz(){
  const Q = view.quiz, pct = Math.round(Q.right / Q.list.length * 100);
  if (Q.kind === 'lesson'){
    const prev = S.done[view.L];
    if (!prev || pct >= prev.s) S.done[view.L] = {s:pct, t:today()};
  } else if (Q.kind === 'test'){
    const prev = S.tests[Q.meta]; if (prev == null || pct > prev) S.tests[Q.meta] = pct;
  }
  save();
}
function grade(q, ok){
  const b = S.box[q.id];
  if (!ok){ S.box[q.id] = {b:1, due:addDays(1)}; return; }
  if (view.quiz.kind === 'review' && b){
    if (b.b >= 3) delete S.box[q.id];
    else S.box[q.id] = {b:b.b+1, due:addDays(b.b === 1 ? 3 : 7)};
  }
}

function render(){
  let h;
  if (view.name === 'home') h = home();
  else if (view.name === 'thread') h = thread(view.ch);
  else if (view.name === 'lesson') h = lessonView();
  else h = top() + `<h2>${view.name==='review'?'مراجعة اليوم':'اختبار الفصل'}</h2><p class="sub">${view.name==='review'?'أسئلة أخطأت فيها سابقًا. الاسترجاع المتباعد يثبّتها.':'أسئلة مخلوطة من كل الدروس، تمامًا كالاختبار الحقيقي.'}</p>` + quizBody();
  app.innerHTML = h;
}

app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'ck') return;
  if (act === 'home') return go({name:'home'});
  if (act === 'thread') return go({name:'thread', ch:el.dataset.ch});
  if (act === 'lesson'){
    const L = el.dataset.l;
    if (!unlocked(L)){
      if (!view.confirmOpen || view.confirmOpen !== L){ view.confirmOpen = L; el.querySelector('.chip').textContent = 'اضغط مرة أخرى لفتحه'; return; }
      S.open[L] = true; save();
    }
    return go({name:'lesson', L, step:0, card:0, gAns:null, rev:false, ck:[]});
  }
  if (act === 'test'){
    const ch = CHAPTERS.find(c=>c.id===el.dataset.ch);
    const ls = chLessons(ch);
    if (!ls.every(passed) && !view.confirmTest){ view.confirmTest = true; el.querySelector('.chip').textContent = 'لم تنهِ الدروس، اضغط للبدء على أي حال'; return; }
    const pool = shuffle(ls.flatMap(allQ)).slice(0, 12);
    view = {name:'test'}; return startQuiz('test', pool, ch.id);
  }
  if (act === 'review'){
    const ids = shuffle(dueIds()).slice(0, 15);
    view = {name:'review'}; return startQuiz('review', ids.map(findQ));
  }
  if (act === 'guess'){ view.gAns = +el.dataset.i; return render(); }
  if (act === 'step'){ view.step = +el.dataset.s; if (view.step === 1) view.card = view.card || 0; render(); return window.scrollTo({top:0}); }
  if (act === 'card'){ view.card += +el.dataset.d; render(); return window.scrollTo({top:0}); }
  if (act === 'rev'){ view.rev = true; return render(); }
  if (act === 'startquiz'){ return startQuiz('lesson', shuffle(allQ(view.L))); }
  if (act === 'ans'){
    const Q = view.quiz, q = Q.list[Q.i], a = +el.dataset.i; if (Q.ans != null) return;
    Q.ans = a; const ok = a === q.c; if (ok) Q.right++; else Q.wrongIds.push(q.id);
    grade(q, ok); save(); return render();
  }
  if (act === 'nextq'){
    const Q = view.quiz; Q.i++; Q.ans = null;
    if (Q.i >= Q.list.length) finishQuiz();
    render(); return window.scrollTo({top:0});
  }
});
app.addEventListener('change', (e) => {
  const el = e.target; if (el.dataset.act !== 'ck') return;
  view.ck = view.ck || []; view.ck[+el.dataset.j] = el.checked; render();
});

render();
})();
</script>

</body></html>
